services:
  postgres:
    image: postgres:17
    container_name: synccode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synccode
      POSTGRES_PASSWORD: synccode
      POSTGRES_DB: synccode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: